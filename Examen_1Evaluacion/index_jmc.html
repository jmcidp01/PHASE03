<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Examen DOM</title>
    <script src="script_jmc.js" defer></script>
</head>
<body>

<h2 id="cita_jmc">Cargando broma de Chuck Norris...</h2>

<label for="color_jmc">Color de la broma:</label>
<select id="color_jmc">
    <option value="black">Negro</option>
    <option value="red">Rojo</option>
    <option value="green">Verde</option>
    <option value="blue">Azul</option>
</select>
<button id="btnColor_jmc">Cambiar color</button>

<h3>Escribe tu joke</h3>

<form id="form_jmc">
    <input type="text" id="texto_jmc" placeholder="Escribe tu joke">
    <button id="btnAdd_jmc">Añadir</button>
</form>

<h3>Tus jokes</h3>
<div id="lista_jmc"></div>

</body>
</html>
