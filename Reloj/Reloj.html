<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj</title>
    <script src="Reloj.js" defer></script>
    <style>
        select{
            margin-top: 5px;
            margin-bottom: 10px;
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            }
        input[type="button"]{
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            }

    </style>
</head>
<body>
    <div id="clock"></div>
    <form>
        <select id="colores">
        <option value="black">Negro (Por defecto)</option>
        <option value="blue">Azul</option>
        <option value="Pink">Rosa</option>
        <option value="Brown">Marrón</option>
        <option value="Red">Rojo</option>
        <option value="Green">Verde</option>
      </select>
      <input type="button" id="pararReloj" value="Pausar/Reanudar Reloj">
    </form>
</body>
</html>
