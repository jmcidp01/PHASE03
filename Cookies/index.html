<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERFORMANCE PARTS STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <main class="main-content">
            <header>
                <div class="header-top">
                    <div class="title-wrapper">
                        <h1>RACING <span class="highlight">PARTS</span></h1>
                    </div>
                    <button id="btn-header-login" class="btn-login-trigger">
                        INICIAR SESIÓN
                    </button>
                </div>
                
                <p>> CATALOGO EXTENDIDO: +200 REFERENCIAS DISPONIBLES</p>

                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="BUSCAR PIEZA (EJ: SUPRA, TURBO, BMW...)" autocomplete="off">
                    <div id="suggestions-box" class="suggestions-box"></div>
                </div>
            </header>

            <section id="product-list" class="products-grid">
                </section>
        </main>

        <aside class="cart-sidebar">
            <div class="cart-header">
                <h2>GARAJE <span class="blink">_</span></h2>
                <span id="item-count-badge" class="badge">0 ITEMS</span>
            </div>

            <div id="cart-items-container" class="cart-items-container"></div>

            <div class="coupon-section">
                <input type="text" id="coupon-input" placeholder="CÓDIGO DESCUENTO">
                <button id="btn-apply-coupon" class="btn-coupon">APLICAR</button>
            </div>

            <div class="cart-footer">
                <div class="total-row discount-row" id="discount-row" style="display:none;">
                    <span>AHORRO:</span>
                    <span id="discount-amount" class="discount-price">-$0.00</span>
                </div>

                <div class="total-row">
                    <span>TOTAL:</span>
                    <span id="cart-total" class="total-price">$0.00</span>
                </div>
                
                <div class="action-buttons">
                    <button id="btn-clear-cart" class="btn-ghost">LIMPIAR</button>
                    <button id="btn-checkout" class="btn-checkout">TRAMITAR PEDIDO</button>
                </div>
            </div>
        </aside>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" data-mode="login">ENTRAR</button>
                <button id="tab-register" class="auth-tab" data-mode="register">REGISTRARSE</button>
            </div>

            <h2 id="modal-title">ACCESO CLIENTE</h2>
            
            <div class="input-group">
                <input type="text" id="auth-user" placeholder="NOMBRE DE USUARIO">
            </div>
            <div class="input-group">
                <input type="password" id="auth-pass" placeholder="CONTRASEÑA">
            </div>
            
            <div class="modal-actions">
                <button id="btn-auth-submit" class="btn-login-submit">CONECTAR</button>
                <button id="btn-close-modal" class="btn-close-modal">CANCELAR</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
