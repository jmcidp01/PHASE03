<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta author="Jose Miguel">
  <title>Clientela Peluquería - Fase 5</title>
  <link rel="stylesheet" href="PHASE03.css">
  <script src="PHASE05.js" defer></script>
</head>
<body>

  <h1>Registro de Clientela</h1>

  <form id="formCliente">
    <div id="clock"></div><br>
    <div id="color">
      <select id="colores">
        <option value="black">Negro (Por defecto)</option>
        <option value="blue">Azul</option>
        <option value="Pink">Rosa</option>
        <option value="Brown">Marrón</option>
        <option value="Red">Rojo</option>
        <option value="Green">Verde</option>
      </select>
    </div>
    <label>Nombre:</label>
    <input type="text" id="nombre"><br><br>

    <label>Año de registro:</label>
    <input type="number" id="anio"><br><br>

    <label>
      <input type="checkbox" id="habitual">
      Cliente habitual
    </label><br><br>

    <label>Categoría:</label>
    <select id="categoria">
      <option value="">Seleccionar...</option>
      <option value="Corte de pelo">Corte de pelo</option>
      <option value="Coloración">Coloración</option>
      <option value="Peinado">Peinado</option>
      <option value="Tratamiento">Tratamiento</option>
    </select><br><br>

    <label>Género:</label><br>
    <input type="radio" name="genero" value="Hombre" id="hombre">
    <label for="hombre">Hombre</label><br>
    <input type="radio" name="genero" value="Mujer" id="mujer">
    <label for="mujer">Mujer</label><br><br>
    <div>
      <table id="Infoclientes">
          <thead>
            <tr><th>Nombre</th><th>Año registro</th><th>Cliente habitual</th><th>Categoría</th><th>Género</th></tr>
          </thead>
          <tbody></tbody>
      </table>
    </div>

  <input type="button" value="Añadir" id="btnAnadir">
  <input type="button" value="Listar clientes" id="btnListar">
  <input type="button" value="Finalizar" id="btnFinalizar">
  <input type="button" value="Eliminar" id="btnEliminar">
  <input type="button" value="Pausar/Reanudar Reloj" id="pararReloj">
  <input type="button" value="Borrar datos" id="btnBorrar">

  <!-- <button type="button" onclick="agregarCliente()">Añadir</button>
    <button type="button" onclick="listarClientes()">Listar clientes</button>
    <button type="button" onclick="finalizar()">Finalizar</button>
    <button type="button" onclick="eliminarCliente()">Eliminar</button>
    
    <button type="button" id="pararReloj">Pausar/Reanudar Reloj</button>
    <button type="button" onclick="borrarDatos()">Borrar datos</button>-->
  
  </form>

  <p id="contador"></p>

</body>
</html>
