<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adivina el Número</title>
</head>
<body>
    <h2>Adivina el número secreto (entre 1 y 100)</h2>
    <label for="intento">Introduce tu número:</label>
    <input type="number" id="intento" min="1" max="100">
    <button id="btnAdivinar">Comprobar</button>
    
    <div id="resultado" style="margin-top: 20px; font-weight: bold;"></div>

    <script src="adivina.js"></script>
</body>
</html>
